name: Language Commit Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Запуск каждую ночь
  workflow_dispatch: # Возможность запускать вручную

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: "" # Отключаем лишнюю общую статистику
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes # Анализирует именно ваши коммиты
          plugin_languages_limit: 8
